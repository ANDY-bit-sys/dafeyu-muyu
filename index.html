<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfcfe">
  <title>大肥鱼木鱼</title>
  <link rel="icon" href="assets/whale.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/dafeyu-idle-v2.png">
  <link rel="preload" as="image" href="assets/dafeyu-strike-v2.png">
  <link rel="stylesheet" href="style.css">
  <script src="desktop/bridge.js" defer></script>
  <script src="animation.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 class="brand"><img src="assets/whale.svg" alt="" width="43" height="38"><span>大肥鱼木鱼</span></h1>
      <div class="header-actions">
        <button class="float-button" id="float-button" type="button" aria-label="悬浮窗" title="打开悬浮窗"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/><rect x="12" y="12" width="6" height="5" rx="1"/></svg><span>悬浮窗</span></button>
        <button class="icon-button" id="sound-toggle" type="button" aria-label="静音" aria-pressed="false" title="静音">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m11 5-6 4H2v6h3l6 4V5Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-cross" d="m16 9 6 6m0-6-6 6"/></svg>
        </button>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="切换到夜间模式" aria-pressed="false" title="夜间模式">
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 15.6A8.8 8.8 0 0 1 8.4 4 8.8 8.8 0 1 0 20 15.6Z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        </button>
        <button class="icon-button" id="download-button" type="button" aria-label="下载安装包" aria-haspopup="dialog" aria-controls="download-dialog" title="下载应用">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
        </button>
        <button class="icon-button" id="support-button" type="button" aria-label="投喂大肥鱼" aria-haspopup="dialog" aria-controls="support-dialog" title="投喂大肥鱼">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>
        </button>
      </div>
    </header>
    <main class="practice" aria-label="和大肥鱼一起敲木鱼">
      <div class="counter">
        <span class="counter-label">累积功德</span>
        <output id="count" aria-label="累积功德">0</output>
      </div>
      <div class="scene" id="scene">
        <div class="scene-art" id="scene-art">
          <img class="hero hero-idle" id="hero-idle" src="assets/dafeyu-idle-v2.png" alt="蓝发的大肥鱼坐在软垫上，举着木槌，身旁放着木鱼，鲸鱼尾巴从臀部后方伸出。" width="1536" height="1024" draggable="false">
          <img class="hero hero-motion" id="hero-strike" src="assets/dafeyu-strike-v2.png" alt="" aria-hidden="true" width="1536" height="1024" draggable="false">
        </div>
        <div class="ripples" id="ripples" aria-hidden="true"></div>
        <div class="merits" id="merits" aria-hidden="true"></div>
        <button class="wood-button" id="wood-button" type="button" aria-label="敲一下木鱼，功德加一" aria-describedby="play-hint"><span class="visually-hidden">敲一下</span></button>
      </div>
      <p class="play-hint" id="play-hint"><span class="hint-desktop">点击木鱼 <span class="hint-separator">·</span> 或按空格</span><span class="hint-touch">轻点木鱼，慢慢来。</span></p>
      <p class="notice" id="notice" role="status" hidden></p>
    </main>
    <footer><button id="reset-button" class="reset-button" type="button">重新开始</button></footer>
  </div>
  <dialog id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description">
    <form method="dialog">
      <h2 id="reset-title">重新开始？</h2>
      <p id="reset-description">累积功德会归零，慢慢敲就好。</p>
      <div class="dialog-actions">
        <button value="cancel" class="cancel-button" autofocus>再敲一会儿</button>
        <button value="reset" class="confirm-button">重新开始</button>
      </div>
    </form>
  </dialog>
  <dialog id="download-dialog" aria-labelledby="download-title" aria-describedby="download-description">
    <h2 id="download-title">下载应用</h2>
    <p id="download-description">离线也能敲。</p>
    <p id="overlay-guide" hidden></p>
    <div class="download-options">
      <a class="download-option" href="downloads/dafeyu-muyu-windows.exe?v=20261009" download="大肥鱼木鱼.exe"><span>Windows 版 <small>.exe</small></span><span class="download-detail">64 位 Windows · 桌面悬浮窗</span></a>
      <a class="download-option" href="downloads/dafeyu-muyu-android.apk?v=1.1.0" download="大肥鱼木鱼.apk"><span>安卓版本 <small>.apk</small></span><span class="download-detail">Android 8.0 及以上 · 手机悬浮窗 · 轻触反馈</span></a>
    </div>
    <form method="dialog" class="dialog-actions"><button class="cancel-button" autofocus>关闭</button></form>
  </dialog>
  <dialog id="support-dialog" aria-labelledby="support-title" aria-describedby="support-description">
    <form method="dialog">
      <h2 id="support-title">投喂大肥鱼</h2>
      <img class="support-animation" src="assets/dafeyu-praying.gif" alt="大肥鱼双手合十的祈愿动图" width="320" height="320" loading="lazy">
      <p id="support-description" class="support-message">如果大肥鱼陪你放松了一会儿，也可以随心投喂，给窝买点零食喵🐳 你的支持会让窝更有动力继续打磨这个小游戏。量力而行，玩得开心就好；愿意来敲敲木鱼，就已经很感谢啦。</p>
      <div class="dialog-actions">
        <button value="yes" class="confirm-button">好呀</button>
        <button value="exit" class="cancel-button" autofocus>退出</button>
      </div>
    </form>
  </dialog>
  <dialog id="support-image-dialog" aria-labelledby="support-image-title">
    <h2 id="support-image-title">谢谢投喂喵🐳</h2>
    <img class="support-image" src="assets/wechat-support.jpg" alt="微信收款码，可使用微信扫码随心投喂大肥鱼" width="1280" height="1731" loading="lazy">
    <form method="dialog" class="dialog-actions"><button class="cancel-button" autofocus>退出</button></form>
  </dialog>
  <div id="announcement" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
